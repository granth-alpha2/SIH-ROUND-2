[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agriprofit-ml"
version = "2.0.0"
description = "AgriProfit AI/ML Crop Yield and Mandi Price Forecasting Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "ml-service"
]
testpaths = [
    "ml-service/tests"
]
python_files = ["test_*.py"]

[tool.pyright]
include = ["ml-service", "scripts"]
extraPaths = [".", "ml-service"]
